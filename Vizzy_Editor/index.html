<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vizzy Editor</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--panel:#1d2127;--dark:#171717;--bd:#2f3139;--btn:#2e353e;--btnh:#3e4854;--btnt:#abb4be;--pri:#00b7ed;--prih:#00a1f2;--lbl:#808697;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#2C2E33;color:#fff;font:13px/1.2 "Oxygen","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
#cv{position:absolute;inset:0;touch-action:none;background-color:#2C2E33;background-image:linear-gradient(#63636313 1px,transparent 1px),linear-gradient(90deg,#63636313 1px,transparent 1px);background-size:32px 32px}
#cv.nogrid{background-image:none}
#world{position:absolute;left:0;top:0}
.stack{position:absolute}
.blk{display:inline-flex;align-items:center;gap:6px;color:#fff;touch-action:none;cursor:grab;vertical-align:middle;max-width:none}
.blk.ins{display:flex;width:max-content;min-height:34px;padding:4px 10px;border-radius:6px;margin-bottom:2px;position:relative}
.blk.ex{min-height:26px;padding:2px 10px;border-radius:14px;margin:1px 0}
.blk.ev{border-radius:6px 6px 14px 14px;padding:6px 14px}
.cblk{display:block;width:max-content;margin-bottom:2px}
.cblk>.head{margin-bottom:0;border-radius:6px 6px 0 0}
.cblk>.body{display:flex}.cblk>.body>.bar{width:20px;flex:none}.cblk>.body>.inner{min-width:140px;min-height:14px;padding-top:2px}
.cblk>.foot{height:12px;border-radius:0 0 6px 6px;width:100%}
.tx{white-space:nowrap}
.slot{display:inline-flex;align-items:center;min-height:22px;border-radius:12px;background:#0003;padding:0 2px;min-width:26px}
.slot>.blk.ex{margin:0;border:1px solid #0004}
.k{background:#262626;border-radius:11px;border:0;color:#fff;font:inherit;padding:2px 8px;min-width:30px;height:22px;outline:none;-webkit-user-select:text;user-select:text}
.k.b{padding:2px 4px}
.pill{border-radius:11px;padding:2px 9px;font-weight:600;height:22px;display:inline-flex;align-items:center;cursor:grab;touch-action:none}
.pm{background:#0004;border:0;color:#fff;border-radius:10px;width:20px;height:20px;line-height:18px;padding:0;cursor:pointer}
#bar{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:30}
.cat{width:50px;height:50px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--btnt);cursor:pointer;font-size:20px;border:0;background:none;border-left:3px solid transparent}
.cat:hover{background:#22292e}.cat.on{color:#fff;border-left-color:var(--pri);background:#22292e}
.sep{height:30px;background:var(--dark);flex:none}
.fly{position:absolute;left:52px;top:0;bottom:0;width:300px;max-width:calc(100vw - 60px);background:var(--panel);border-right:1px solid var(--bd);z-index:29;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.fh{height:30px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--pri);font-weight:700;letter-spacing:.04em;flex:none}
.fh b{cursor:pointer;color:var(--btnt);font-size:16px}
.fb{overflow:auto;flex:1;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.btn{height:30px;border:0;border-radius:3px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:600;cursor:pointer;padding:0 12px;width:100%}
.btn:hover{background:var(--btnh)}.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--prih)}.btn:disabled{opacity:.45}
.hr{height:1px;background:var(--bd);width:100%;margin:4px 0}
.row2{display:flex;gap:8px;width:100%}.row2 .btn{width:50%}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--lbl)}
#trash{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:150px;height:110px;border:2px dashed #fff5;border-radius:10px;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fffc;z-index:40;font-size:12px;background:#0004}
#trash.hot{border-color:#e7515a;background:#e7515a33}#trash span{font-size:34px}
#msg{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#111111f0;padding:8px 16px;border-radius:6px;z-index:50;display:none;max-width:70vw;text-align:center}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:.92}
.hl{outline:2px solid var(--pri);outline-offset:1px}.hlline{position:fixed;height:4px;background:var(--pri);z-index:90;pointer-events:none;border-radius:2px;display:none}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:200}
#modal>div{background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:18px;width:min(420px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#modal h3{margin:0;color:var(--pri);font-size:14px}#modal input{background:#171b1f;border:1px solid var(--bd);color:#fff;padding:8px;border-radius:3px;font:inherit;-webkit-user-select:text;user-select:text}
.credit{font-size:11px;color:var(--lbl);margin-top:auto;padding-top:8px}.credit a{color:var(--pri)}
</style>
</head>
<body>
<div id="cv"><div id="world"></div></div>
<div id="bar"></div>
<div class="fly" id="fly" hidden></div>
<div id="trash"><span>🗑</span>Drag to Delete</div>
<div id="msg"></div><div class="hlline" id="hl"></div><div id="ghost"></div>
<div id="modal"><div id="mbox"></div></div>
<input type="file" id="file" accept=".xml,text/xml" hidden>

  let f=n.a.format||n.a.callFormat||(n.t==="CallCustomInstruction"||n.t==="CallCustomExpression"?callFmt(n):sty(n).f)||"";
  if(n.t==="CustomExpression"||n.t==="CustomInstruction")f=n.a.format;
  if(n.t.startsWith("Call")&&n.a.call)f=callFmt(n);
  return [...f.matchAll(/\((\d+)(?::\w+)?\)|\{(\d+)\}|\|([^|]+)\||([^(){}|]+)/g)].map(m=>m[1]!=null?{s:+m[1]}:m[2]!=null?{s:+m[2]}:m[3]!=null?{p:m[3]}:{x:m[4]});}
function callFmt(n){const d=findDef(n.a.call);return d?d.a.callFormat:n.a.call+" "+n.s.map((_,i)=>"("+i+")").join(" ");}
function findDef(name){let r=null;const w=n=>{if((n.t==="CustomInstruction"||n.t==="CustomExpression")&&n.a.name===name)r=n;n.s.forEach(w);(n.i||[]).forEach(w)};P.stacks.forEach(s=>s.i.forEach(w));P.exprs.forEach(e=>w(e.n));return r;}
function allDefs(t){const r=[];const w=n=>{if(n.t===t)r.push(n);n.s.forEach(w);(n.i||[]).forEach(w)};P.stacks.forEach(s=>s.i.forEach(w));P.exprs.forEach(e=>w(e.n));return r;}
const VARSLOT=n=>n.a.style&&/^(set-variable|change-variable|user-input|list-)/.test(n.a.style);

/* ---------- render ---------- */
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
function pill(n,txt,color){const p=el("span","pill",txt);p.style.background=color;p.dataset.u=n.u;return p;}
function render(n,box){ // returns element for node n
  if(n.t==="Constant")return konst(n);
  if(n.t==="Variable")return varNode(n);
  const s=sty(n),ins=isIns(n),e=el("div","blk "+(n.t==="Event"?"ev ":"")+(ins?"ins":"ex"));
  e.dataset.u=n.u;const bg=col(n.t.startsWith("Call")?"CallCustom":s.c);e.style.background=n.t.startsWith("Call")?col("CallCustom"):bg;
  if(n.t.startsWith("Call"))e.style.color="#fff";
  if(s.x)e.style.color=col(s.x);
  e.title=s.t||"";
  const eventName={FlightStart:"when flight starts",ReceiveMessage:"on message"}[n.a.event];
  const pr=parts(n);let any=false;
  for(const x of pr){
    if(x.x!=null){const t=el("span","tx",x.x.replace(/^\s+|\s+$/g,m=>m?" ":""));e.appendChild(t);}
    else if(x.p!=null){const c=pill(n,x.p,"#0005");c.dataset.p=x.p;c.dataset.local="1";e.appendChild(c);}
    else{e.appendChild(slot(n,x.s));}
  }
  if(s.d||n.t==="StringOp"&&/join|format/.test(n.a.op||"")&&s.d){/* dynamic */}
  if(s.d){const m=el("button","pm","−"),p=el("button","pm","+");p.dataset.act="add";m.dataset.act="del";p.dataset.u=m.dataset.u=n.u;
    for(let i=0;i<n.s.length;i++)e.appendChild(slot(n,i));e.append(m,p);}
  if(n.t==="Event"&&n.a.event==="ReceiveMessage"){}
  if(n.t==="CustomInstruction"||n.t==="CustomExpression"){e.style.background=col("CustomInstruction");}
  if(isBlk(n)){const c=el("div","cblk");e.classList.add("head");e.style.borderRadius="6px 6px 0 0";e.style.marginBottom="0";c.dataset.u=n.u;
    const b=el("div","body"),bar=el("div","bar"),inn=el("div","inner");bar.style.background=bg;inn.dataset.u=n.u;inn.dataset.zone="1";
    n.i.forEach(x=>inn.appendChild(render(x)));b.append(bar,inn);const ft=el("div","foot");ft.style.background=bg;c.append(e,b,ft);return c;}
  return e;
}
function konst(n){
  const s=sty(n),isB=n.a.bool!==undefined,w=el("span","blk ex");w.style.background="#262626";w.dataset.u=n.u;w.style.padding="0";w.style.cursor="default";
  let i;
  if(isB){i=el("select","k b");["true","false"].forEach(v=>{const o=el("option",null,v);if(n.a.bool===v)o.selected=true;i.appendChild(o);});i.onchange=()=>{n.a.bool=i.value;};}
  else{i=el("input","k");i.value=n.a.number!==undefined?n.a.number:n.a.text||"";i.size=Math.max(3,i.value.length+1);
    i.oninput=()=>{i.size=Math.max(3,i.value.length+1);};
    i.onchange=()=>{const v=i.value;delete n.a.number;delete n.a.text;if(v!==""&&!isNaN(v)&&n.a.keepText!==1)n.a.number=v;else n.a.text=v;snap();};
    if(s.x)i.style.color=col(s.x);
    i.placeholder=" ";}
  i.onpointerdown=e=>e.stopPropagation();w.appendChild(i);return w;}
function varNode(n){const loc=n.a.local==="true";const p=pill(n,n.a.variableName||"?",loc?col("LocalVariable"):col("GlobalVariable"));p.className+=" blk ex";p.style.color="#fff";p.style.margin="0";p.dataset.u=n.u;return p;}
function slot(n,i){
  const sl=el("span","slot");sl.dataset.u=n.u;sl.dataset.i=i;const c=n.s[i];
  if(!c){return sl;}
  if(c.t==="Constant"&&VARSLOT(n)&&i===0){
    const list=/^list-/.test(n.a.style)||n.a.style==="list-init";
    const sel=el("select","k b");sel.appendChild(el("option",null,"select…"));
    P.vars.filter(v=>list?v.list:!v.list).forEach(v=>{const o=el("option",null,v.name);sel.appendChild(o);});
    sel.onpointerdown=e=>e.stopPropagation();
    sel.onchange=()=>{const v=P.vars.find(x=>x.name===sel.value);if(v){n.s[0]=mk("Variable",{list:String(!!v.list),local:"false",variableName:v.name});snap();}};
    sl.appendChild(sel);return sl;}
  sl.appendChild(render(c));return sl;}
function stackEl(st){const d=el("div","stack");d.style.left=st.x+"px";d.style.top=st.y+"px";d.dataset.s=st.id;st.i.forEach(n=>d.appendChild(render(n)));return d;}
function draw(){
  const w=$("world");w.innerHTML="";w.style.transform="translate("+ox+"px,"+oy+"px)";
  P.stacks.forEach(s=>w.appendChild(stackEl(s)));
  P.exprs.forEach(e=>{const d=el("div","stack");d.style.left=e.x+"px";d.style.top=e.y+"px";d.dataset.e=e.id;d.appendChild(render(e.n));w.appendChild(d);});
  if(openCat!==null)flyBody();
}
/* ---------- undo ---------- */
const ser=()=>JSON.stringify(P);
function snap(){und.push(ser());if(und.length>100)und.shift();red=[];draw();}
function undo(){if(!und.length)return;const cur=ser();red.push(cur);P=JSON.parse(und.pop());sync();draw();}
function redo(){if(!red.length)return;und.push(ser());P=JSON.parse(red.pop());sync();draw();}
function sync(){const m=n=>{if(n.u>=uid)uid=n.u+1;n.s.forEach(m);(n.i||[]).forEach(m)};P.stacks.forEach(s=>s.i.forEach(m));P.exprs.forEach(e=>m(e.n));}
function msg(t){const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display="none",2600);}

/* ---------- model helpers ---------- */
function locate(u){ // find node u and its container
  let r=null;
  const walk=(n,par,list,idx,slotI)=>{if(r)return;if(n.u===u){r={n,par,list,idx,slotI};return;}n.s.forEach((c,i)=>walk(c,n,null,i,i));(n.i||[]).forEach((c,i)=>walk(c,n,n.i,i));};
  P.stacks.forEach(s=>s.i.forEach((n,i)=>walk(n,s,s.i,i)));P.exprs.forEach(e=>walk(e.n,e,null,0,-1));return r;}
function defConst(n,i){const f=sty(n).f||"";return mk("Constant",new RegExp("\\{"+i+"\\}").test(f)?{bool:"false"}:{text:""});}
/* take node out; returns array of nodes being dragged */
function lift(u){
  const L=locate(u);if(!L)return null;let out;
  if(L.slotI>=0&&L.par.t){out=[L.n];L.par.s[L.slotI]=defConst(L.par,L.slotI);}
  else if(L.slotI===-1){out=[L.n];P.exprs=P.exprs.filter(e=>e!==L.par);}
  else if(L.list){out=L.list.splice(L.idx);if(L.par&&L.par.i===undefined&&!L.par.i&&L.list.length===0&&L.par.i!==L.list){P.stacks=P.stacks.filter(s=>s.i.length);}}
  P.stacks=P.stacks.filter(s=>s.i.length);return out;}
function dropAt(group,target,x,y){
  const g0=group[0];
  if(!isIns(g0)){ // expression
    const sl=target&&target.closest(".slot");
    if(sl){const L=locate(+sl.dataset.u);if(L){L.n.s[+sl.dataset.i]=g0;return;}}
    P.exprs.push({id:uid++,x,y,n:g0});return;}
  if(g0.t!=="Event"&&g0.t!=="CustomInstruction"&&target){
    const inner=target.closest(".inner"),b=target.closest(".blk.ins,.cblk>.head");
    if(b&&b.dataset.u){const L=locate(+b.dataset.u);if(L&&L.list){const r=b.getBoundingClientRect(),after=drop.y>r.top+r.height/2||(L.n.t==="Event"||L.n.t==="CustomInstruction");
      const idx=L.idx+(after?1:0);
      if(isBlk(L.n)&&drop.y>r.top+r.height/2&&b.classList.contains("head")){L.n.i.unshift(...group);return;}
      L.list.splice(idx,0,...group);return;}}
    if(inner){const L=locate(+inner.dataset.u);if(L){L.n.i.unshift(...group);return;}}}
  P.stacks.push({id:uid++,x,y,i:group});}
let drop={x:0,y:0};

/* ---------- drag ---------- */
let drag=null;
function startDrag(e,node,fromTool,src){
  const g=el("div");$("ghost").innerHTML="";
  drag={node,fromTool,x0:e.clientX,y0:e.clientY,go:false,src,id:e.pointerId};
  window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",onUp,{once:true});window.addEventListener("pointercancel",onUp,{once:true});
}
function onMove(e){
  if(!drag)return;
  if(!drag.go){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
    drag.go=true;let group;
    if(drag.fromTool){group=[JSON.parse(JSON.stringify(drag.node))];const rs=n=>{n.u=uid++;n.s.forEach(rs);(n.i||[]).forEach(rs)};rs(group[0]);}
    else{const r=drag.src.getBoundingClientRect();drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;group=lift(drag.node);if(!group)return drag=null;}
    if(drag.fromTool){drag.ox=20;drag.oy=14;closeFly();}
    drag.group=group;const gh=$("ghost");gh.innerHTML="";const w=el("div");group.forEach(n=>w.appendChild(render(n)));gh.appendChild(w);
    $("trash").style.display="flex";if(!drag.fromTool)draw();}
  const gh=$("ghost");gh.style.transform="translate("+(e.clientX-drag.ox)+"px,"+(e.clientY-drag.oy)+"px)";
  gh.style.display="none";const t=document.elementFromPoint(e.clientX,e.clientY);gh.style.display="";
  const tr=$("trash").getBoundingClientRect();drag.trash=e.clientX>tr.left&&e.clientX<tr.right&&e.clientY>tr.top&&e.clientY<tr.bottom;
  $("trash").classList.toggle("hot",drag.trash);drag.t=t;drag.px=e.clientX;drag.py=e.clientY;
  document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  const hl=$("hl");hl.style.display="none";
  if(t&&!drag.trash){if(!isIns(drag.group[0])){const s=t.closest(".slot");if(s)s.classList.add("hl");}
    else{const b=t.closest(".blk.ins,.cblk>.head");if(b&&drag.group[0].t!=="Event"){const r=b.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;hl.style.cssText="display:block;left:"+r.left+"px;width:"+r.width+"px;top:"+((after?r.bottom:r.top)-2)+"px";}}}
}
function onUp(e){
  window.removeEventListener("pointermove",onMove);
  const d=drag;drag=null;$("ghost").innerHTML="";$("trash").style.display="none";$("hl").style.display="none";document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  if(!d||!d.go)return;
  if(d.trash){snap();msg("Deleted");return;}
  const cr=$("cv").getBoundingClientRect();drop={x:e.clientX,y:e.clientY};
  dropAt(d.group,d.t,e.clientX-d.ox-cr.left-ox,e.clientY-d.oy-cr.top-oy);snap();
}
$("world").addEventListener("pointerdown",e=>{
  if(e.target.closest("input,select"))return;
  const b=e.target.closest("[data-u]");if(!b)return;
  if(e.target.dataset.act)return;
  let u=+b.dataset.u;
  if(b.dataset.local){startDrag(e,mk("Variable",{list:"false",local:"true",variableName:b.dataset.p}),true);return;}
  const blk=b.closest(".blk,.pill");if(!blk||(blk.classList.contains("pill")&&!blk.classList.contains("ex")))return;
  e.stopPropagation();e.preventDefault();startDrag(e,u,false,(b.closest(".cblk")||b));
});
$("world").addEventListener("click",e=>{const a=e.target.dataset.act;if(!a)return;const L=locate(+e.target.dataset.u);if(!L)return;
  if(a==="add")L.n.s.push(mk("Constant",{text:""}));else if(L.n.s.length>2)L.n.s.pop();snap();});
/* pan */
$("cv").addEventListener("pointerdown",e=>{if(e.target!==$("cv")&&e.target!==$("world"))return;closeFly();
  const sx=e.clientX-ox,sy=e.clientY-oy;const mv=ev=>{ox=ev.clientX-sx;oy=ev.clientY-sy;$("world").style.transform="translate("+ox+"px,"+oy+"px)";};
  const up=()=>{window.removeEventListener("pointermove",mv);};window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up,{once:true});});

/* ---------- side bar / flyouts ---------- */
const CATS=T.cats.map((c,i)=>({n:c.n,i:c.i,ic:ICON[i]||"▪"}));
function bar(){$("bar").innerHTML="";CATS.forEach((c,i)=>{const b=el("button","cat"+(openCat===i?" on":""),c.ic);b.title=c.n;b.onclick=()=>open(i);$("bar").appendChild(b);});
  $("bar").appendChild(el("div","sep"));const m=el("button","cat"+(openCat==="menu"?" on":""),"☰");m.title="Menu";m.style.fontSize="22px";m.onclick=()=>open("menu");$("bar").appendChild(m);}

      const ed=el("button","pm","✎");ed.onclick=()=>editVar(v);r.append(p,ed);b.appendChild(r);});

  if(c.n==="Custom Expressions"||c.n==="Custom Instructions"){
    const ex=c.n==="Custom Expressions";
    allDefs(ex?"CustomExpression":"CustomInstruction").forEach(d=>{const n=mk(ex?"CallCustomExpression":"CallCustomInstruction",{call:d.a.name,style:ex?"call-custom-expression":"call-custom-instruction"},(d.a.callFormat.match(/\(\d+\)/g)||[]).map(()=>mk("Constant",{text:""})));
      const w=render(n);w.onpointerdown=e=>{if(e.target.closest("input,select"))return;e.preventDefault();startDrag(e,n,true);};b.appendChild(w);});
    const cb=el("button","btn pri","CREATE");cb.style.marginTop="auto";cb.onclick=()=>createCustom(ex);b.appendChild(cb);}
}
function createCustom(ex){
  ask("Name of the custom "+(ex?"expression":"instruction")+" (add parameters after a colon, e.g. Add:a,b)","",v=>{
    const [nm,ps]=v.split(":");const name=nm.trim();if(!name)return;const pr=(ps||"").split(",").map(s=>s.trim()).filter(Boolean);
    const fmt=name+pr.map(p=>" |"+p+"|").join("")+(ex?" return (0)":""),cf=name+pr.map((_,i)=>" ("+i+")").join("");
    const n=mk(ex?"CustomExpression":"CustomInstruction",{name,format:fmt,callFormat:cf,style:ex?"custom-expression":"custom-instruction"},ex?[mk("Constant",{number:"0"})]:[],undefined);
    const cr=$("cv").getBoundingClientRect();const x=140-ox,y=120-oy;

  P.stacks.forEach(s=>s.i.forEach(w));P.exprs.forEach(e=>w(e.n));if(nm)v.name=nm;else P.vars=P.vars.filter(x=>x!==v);snap();});}

const homeUrl=()=>location.protocol==="file:"?"../index.html":(/\.github\.io$/i.test(location.hostname)?location.origin+"/"+location.pathname.split("/")[1]+"/":"https://anda2012.github.io/Juno_New_Origins_Tools/");

/* ---------- XML in / out ---------- */
const parseNode=e=>{const a={};for(const x of e.attributes)if(x.name!=="id"&&x.name!=="pos")a[x.name]=x.value;const n=mk(e.tagName,a);
  for(const c of e.children){if(c.tagName==="Instructions")n.i=[...c.children].map(parseNode);else n.s.push(parseNode(c));}if(isBlk(n)&&!n.i)n.i=[];return n;};
const pp=s=>{const [x,y]=(s||"0,0").split(",").map(parseFloat);return{x:x||0,y:y||0};};
function fromProgram(pe){
  const Q=NEW();Q.name=pe.getAttribute("name")||"Program";
  [...(pe.querySelector(":scope > Variables")?.children||[])].forEach(v=>Q.vars.push({name:v.getAttribute("name"),list:!!v.querySelector("Items"),raw:Object.fromEntries([...v.attributes].map(a=>[a.name,a.value])),items:v.querySelector("Items")?.outerHTML}));
  pe.querySelectorAll(":scope > Instructions").forEach((ie,k)=>{const l=[...ie.children].map(parseNode);if(l.length){const p=pp(ie.children[0].getAttribute("pos"));Q.stacks.push({id:uid++,x:p.x,y:p.y,i:l});}});
  pe.querySelectorAll(":scope > Expressions > *").forEach(c=>{const p=pp(c.getAttribute("pos"));Q.exprs.push({id:uid++,x:p.x,y:p.y,n:parseNode(c)});});
  return Q;}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let nid=0;
function xn(n,pos,pad){
  const at=Object.entries(n.a).filter(([k])=>k!=="style"&&k!=="keepText").map(([k,v])=>" "+k+'="'+esc(v)+'"').join("");
  const idp=isIns(n)?' id="'+(nid++)+'"':"",st=n.a.style?' style="'+esc(n.a.style)+'"':"",ps=pos?' pos="'+pos.x+","+pos.y+'"':"";
  const kids=n.s.map(c=>xn(c,null,pad+"  ")),blk=n.i?pad+"  <Instructions>\n"+n.i.map(c=>xn(c,null,pad+"    ")).join("")+pad+"  </Instructions>\n":"";
  const head=pad+"<"+n.t+at+idp+st+ps;
  return kids.length||blk?head+">\n"+kids.join("")+blk+pad+"</"+n.t+">\n":head+" />\n";}
function toXml(){
  nid=0;let s='<Program name="'+esc(P.name)+'">\n  <Variables>\n';
  P.vars.forEach(v=>{s+=v.list?'    <Variable name="'+esc(v.name)+'">\n      <Items />\n    </Variable>\n':'    <Variable name="'+esc(v.name)+'" number="'+esc((v.raw&&v.raw.number)||"0")+'" />\n';});
  s+="  </Variables>\n";
  P.stacks.forEach(st=>{s+="  <Instructions>\n"+st.i.map((n,k)=>xn(n,k===0?{x:Math.round(st.x*1e4)/1e4,y:Math.round(st.y*1e4)/1e4}:null,"    ")).join("")+"  </Instructions>\n";});
  s+="  <Expressions>\n"+P.exprs.map(e=>xn(e.n,{x:Math.round(e.x*1e4)/1e4,y:Math.round(e.y*1e4)/1e4},"    ")).join("")+"  </Expressions>\n</Program>\n";return s;}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/xml"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f);};
function loadText(t,name){
  const d=new DOMParser().parseFromString(t,"application/xml");if(d.querySelector("parsererror"))return msg("That file isn’t valid XML");
  let progs=[...d.querySelectorAll("Program")];if(!progs.length)return msg("No Vizzy program found in that file");
  const go=pe=>{const Q=fromProgram(pe);
    if(selfile==="import"){und.push(ser());Q.stacks.forEach(s=>{s.x+=40;s.y+=40;P.stacks.push(s)});Q.exprs.forEach(x=>P.exprs.push(x));Q.vars.forEach(v=>{if(!P.vars.some(y=>y.name===v.name))P.vars.push(v)});snap();msg("Imported");}
    else{und.push(ser());P=Q;sync();if(d.documentElement.tagName==="Craft"){craft={doc:d,prog:pe,name};}else craft=null;
      const xs=[...P.stacks.map(s=>s),...P.exprs];if(xs.length){ox=60-Math.min(...xs.map(s=>s.x));oy=60-Math.min(...xs.map(s=>s.y));}snap();msg("Loaded "+Q.name);}
    closeFly();};
  if(progs.length===1)return go(progs[0]);
  chooser(progs.map((p,i)=>{const part=p.closest("Part");return (part?(part.getAttribute("name")||part.getAttribute("partType"))+" – ":"")+(p.getAttribute("name")||"Program");}),i=>go(progs[i]));}
function saveCraft(){
  if(!craft)return msg("Load a craft file first (Load Program), then pick its program.");
  const x=new DOMParser().parseFromString(toXml(),"application/xml").documentElement,np=craft.doc.importNode(x,true);
  craft.prog.parentNode.replaceChild(np,craft.prog);craft.prog=np;
  download(craft.name.replace(/\.xml$/i,"")+"_vizzy.xml",'<?xml version="1.0" encoding="utf-8"?>\n'+new XMLSerializer().serializeToString(craft.doc.documentElement)+"\n");}

function chooser(list,cb){const w=el("div");w.append(el("h3",null,"Choose a program"));list.forEach((t,i)=>{const b=el("button","btn",t);b.onclick=()=>{hide();cb(i);};w.appendChild(b);});const c=el("button","btn","Cancel");c.onclick=hide;w.appendChild(c);modal(w);}
