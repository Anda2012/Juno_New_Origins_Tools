<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Vizzy Editor</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--panel:#1d2127;--dark:#171717;--bd:#2f3139;--btn:#2e353e;--btnh:#3e4854;--btnt:#abb4be;--pri:#00b7ed;--prih:#00a1f2;--lbl:#808697;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:#2C2E33;color:#fff;font:13px/1.2 "Oxygen","Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
#cv{position:absolute;inset:0;touch-action:none;background-color:#2C2E33;background-image:linear-gradient(#63636313 1px,transparent 1px),linear-gradient(90deg,#63636313 1px,transparent 1px);background-size:32px 32px}
#cv.nogrid{background-image:none}
#world{position:absolute;left:0;top:0}
.stack{position:absolute}
#world{transform-origin:0 0}
.blk{display:inline-flex;align-items:center;gap:6px;color:#fff;touch-action:none;cursor:grab;vertical-align:middle;font-size:14px;line-height:1;font-family:"Roboto","Segoe UI",system-ui,sans-serif}
.blk.ins{display:flex;width:max-content;height:26px;padding:0 8px;border-radius:2px;margin-bottom:2px;position:relative}
.blk.ex{height:22px;padding:0 8px;border-radius:11px;margin:0;border:2px solid transparent}
.cblk{display:block;width:max-content;margin-bottom:2px}
.cblk>.head{margin-bottom:0}
.cblk>.body{display:flex}.cblk>.body>.bar{width:8px;flex:none}.cblk>.body>.inner{min-width:120px;min-height:10px;padding-top:2px}
.cblk>.foot{height:6px;width:100%}
.tx{white-space:nowrap}
.slot{display:inline-flex;align-items:center;min-height:20px;min-width:22px}
.k{background:transparent;border:0;color:#fff;font:inherit;padding:0 8px;min-width:22px;height:18px;outline:none;-webkit-user-select:text;user-select:text;text-align:left}
.k.b{padding:0 2px}
.pill{border-radius:10px;padding:0 9px;font-weight:500;height:20px;display:inline-flex;align-items:center;cursor:grab;touch-action:none;border:0}
.dd{position:relative;display:inline-flex;align-items:center;gap:4px;background:#0003;border-radius:10px;padding:0 6px;height:18px;white-space:nowrap}
.dd select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.pm{background:#0004;border:0;color:#fff;border-radius:10px;width:18px;height:18px;line-height:16px;padding:0;cursor:pointer}
[hidden]{display:none!important}
#zoom{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:25}
#zoom button{width:36px;height:36px;border:0;border-radius:4px;background:var(--btn);color:var(--btnt);font:600 18px system-ui;cursor:pointer}#zoom button:hover{background:var(--btnh)}
#bar{position:absolute;left:0;top:0;bottom:0;width:52px;background:var(--panel);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);z-index:30}
.cat{width:50px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--btnt);cursor:pointer;border:0;background:none;padding:0}
.cat:hover{background:#22292e}.cat.on{color:var(--pri)}.cat svg{width:36px;height:36px}
.sep{height:30px;background:var(--dark);flex:none;margin-bottom:6px}
.fly{position:absolute;left:52px;top:0;bottom:0;max-width:calc(100vw - 60px);background:var(--panel);border-right:1px solid var(--bd);z-index:29;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.fh{height:30px;background:var(--dark);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--pri);font-weight:700;letter-spacing:.04em;flex:none}
.fh b{cursor:pointer;color:var(--btnt);font-size:16px}
.fb{overflow:scroll;flex:1;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#59636f #171b1f;overscroll-behavior:contain}
.fb::-webkit-scrollbar{width:10px;height:10px}.fb::-webkit-scrollbar-track{background:#171b1f}.fb::-webkit-scrollbar-thumb{background:#59636f;border-radius:5px;border:2px solid #171b1f}.fb::-webkit-scrollbar-thumb:hover{background:#7b8794}.fb::-webkit-scrollbar-corner{background:#171b1f}
#fly .blk,#fly .pill,#fly .cblk{touch-action:pan-y}
.fly{width:min(300px,70vw);transition:opacity .12s}.fly.dim{opacity:.15;pointer-events:none}
.btn{height:30px;border:0;border-radius:3px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:600;cursor:pointer;padding:0 12px;width:100%}
.btn:hover{background:var(--btnh)}.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:var(--prih)}.btn:disabled{opacity:.45}
.hr{height:1px;background:var(--bd);width:100%;margin:4px 0}
.row2{display:flex;gap:8px;width:100%}.row2 .btn{width:50%}
.tog{display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--lbl)}
#trash{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top,0px));width:150px;height:110px;border:2px dashed #fff5;border-radius:10px;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fffc;z-index:40;font-size:12px;background:#0004}
#trash.hot{border-color:#e7515a;background:#e7515a33}#trash span{font-size:34px}
#msg{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#111111f0;padding:8px 16px;border-radius:6px;z-index:50;display:none;max-width:70vw;text-align:center}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;opacity:.92}
.hl{outline:2px solid var(--pri);outline-offset:1px}.hlline{position:fixed;height:6px;background:var(--pri);z-index:90;pointer-events:none;border-radius:3px;display:none}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:200}
#modal>div{background:var(--panel);border:1px solid var(--bd);border-radius:4px;padding:18px;width:min(420px,92vw);max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#modal h3{margin:0;color:var(--pri);font-size:14px}#modal input{background:#171b1f;border:1px solid var(--bd);color:#fff;padding:8px;border-radius:3px;font:inherit;-webkit-user-select:text;user-select:text}
.credit{font-size:11px;color:var(--lbl);margin-top:auto;padding-top:8px}.credit a{color:var(--pri)}
</style>
</head>
<body>
<div id="cv"><div id="world"></div></div>
<div id="bar"></div>
<div class="fly" id="fly" hidden></div>
<div id="zoom"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zrs" title="Reset view">⌂</button></div>
<div id="trash"><span>🗑</span>Drag to Delete</div>
<div id="msg"></div><div class="hlline" id="hl"></div><div id="ghost"></div>
<div id="modal"><div id="mbox"></div></div>
<input type="file" id="file" accept=".xml,text/xml" hidden>

$("world").addEventListener("click",e=>{const a=e.target.dataset.act;if(!a)return;const L=locate(+e.target.dataset.u);if(!L)return;
  if(a==="add")L.n.s.push(mk("Constant",{text:""}));else if(L.n.s.length>2)L.n.s.pop();snap();});
/* pan */
$("cv").addEventListener("pointerdown",e=>{if(e.target!==$("cv")&&e.target!==$("world"))return;
  const sx=e.clientX-ox,sy=e.clientY-oy,x0=e.clientX,y0=e.clientY;let moved=0;const mv=ev=>{if(pinch)return;moved=Math.max(moved,Math.hypot(ev.clientX-x0,ev.clientY-y0));ox=ev.clientX-sx;oy=ev.clientY-sy;applyT();};
  const up=()=>{window.removeEventListener("pointermove",mv);if(moved<5&&!pinch)closeFly();};window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up,{once:true});});

/* ---------- side bar / flyouts ---------- */
const CATS=T.cats.map((c,i)=>({n:c.n,i:c.i,ic:ICON[i]||"▪"}));
function bar(){$("bar").innerHTML="";$("bar").appendChild(el("div","sep"));
  const m=el("button","cat"+(openCat==="menu"?" on":""));m.innerHTML=SV('<g><rect x="5" y="8" width="38" height="7" rx="3.5"/><rect x="5" y="20.5" width="38" height="7" rx="3.5"/><rect x="5" y="33" width="38" height="7" rx="3.5"/></g>');m.title="Menu";m.onclick=()=>open("menu");$("bar").appendChild(m);
  CATS.forEach((c,i)=>{const b=el("button","cat"+(openCat===i?" on":""));b.innerHTML=c.ic;b.title=c.n;b.onclick=()=>open(i);$("bar").appendChild(b);});}
function open(i){openCat=openCat===i?null:i;bar();if(openCat===null)return closeFly();$("fly").hidden=false;flyBody();}
function closeFly(){openCat=null;$("fly").hidden=true;bar();}
function flyBody(){
  const f=$("fly");f.innerHTML="";
  const name=openCat==="menu"?"MENU":CATS[openCat].n.toUpperCase();
  const h=el("div","fh");h.append(el("span",null,name));const x=el("b",null,"✕");x.onclick=closeFly;h.appendChild(x);f.appendChild(h);
  const b=el("div","fb");f.appendChild(b);
  if(openCat==="menu")return menu(b);
  const c=CATS[openCat];
  c.i.forEach(t=>{const n=fromTpl(t);const w=el("div");w.style.maxWidth="100%";w.appendChild(render(n));w.firstChild.onpointerdown=e=>{if(e.target.closest("input,select"))return;e.preventDefault();startDrag(e,n,true);};b.appendChild(w);});
  if(c.n==="Variables"||c.n==="Lists"){
    const isL=c.n==="Lists";
    P.vars.filter(v=>!!v.list===isL).forEach(v=>{const r=el("div");r.style.cssText="display:flex;gap:6px;align-items:center";const n=mk("Variable",{list:String(isL),local:"false",variableName:v.name});const p=render(n);p.onpointerdown=e=>{e.preventDefault();startDrag(e,n,true);};
      const ed=el("button","pm","✎");ed.onclick=()=>editVar(v);r.append(p,ed);b.appendChild(r);});
    const cb=el("button","btn pri",isL?"CREATE LIST":"CREATE VARIABLE");cb.style.marginTop="auto";cb.onclick=()=>ask("New "+(isL?"list":"variable")+" name","",nm=>{nm=nm.trim();if(!nm)return;if(P.vars.some(v=>v.name===nm))return msg("That name is taken");P.vars.push({name:nm,list:isL});snap();});b.appendChild(cb);}
  if(c.n==="Custom Expressions"||c.n==="Custom Instructions"){
    const ex=c.n==="Custom Expressions";
    allDefs(ex?"CustomExpression":"CustomInstruction").forEach(d=>{const n=mk(ex?"CallCustomExpression":"CallCustomInstruction",{call:d.a.name,style:ex?"call-custom-expression":"call-custom-instruction"},(d.a.callFormat.match(/\(\d+\)/g)||[]).map(()=>mk("Constant",{text:""})));
      const w=render(n);w.onpointerdown=e=>{if(e.target.closest("input,select"))return;e.preventDefault();startDrag(e,n,true);};b.appendChild(w);});
    const cb=el("button","btn pri","CREATE");cb.style.marginTop="auto";cb.onclick=()=>createCustom(ex);b.appendChild(cb);}
}
function createCustom(ex){
  ask("Name of the custom "+(ex?"expression":"instruction")+" (add parameters after a colon, e.g. Add:a,b)","",v=>{
    const [nm,ps]=v.split(":");const name=nm.trim();if(!name)return;const pr=(ps||"").split(",").map(s=>s.trim()).filter(Boolean);
    const fmt=name+pr.map(p=>" |"+p+"|").join("")+(ex?" return (0)":""),cf=name+pr.map((_,i)=>" ("+i+")").join("");
    const n=mk(ex?"CustomExpression":"CustomInstruction",{name,format:fmt,callFormat:cf,style:ex?"custom-expression":"custom-instruction"},ex?[mk("Constant",{number:"0"})]:[],undefined);
    const cr=$("cv").getBoundingClientRect();const x=(140-ox)/z,y=(120-oy)/z;
    if(ex)P.exprs.push({id:uid++,x,y,n});else P.stacks.push({id:uid++,x,y,i:[n]});closeFly();snap();});}
function editVar(v){ask("Rename variable (empty to delete)",v.name,nm=>{nm=nm.trim();const old=v.name;
  const w=n=>{if(n.t==="Variable"&&n.a.variableName===old&&n.a.local!=="true"){if(nm)n.a.variableName=nm;else n.a.variableName="";}n.s.forEach(w);(n.i||[]).forEach(w)};
  P.stacks.forEach(s=>s.i.forEach(w));P.exprs.forEach(e=>w(e.n));if(nm)v.name=nm;else P.vars=P.vars.filter(x=>x!==v);snap();});}
function menu(b){
  const B=(t,fn,c,tip)=>{const x=el("button","btn "+(c||""),t);x.onclick=fn;if(tip)x.title=tip;b.appendChild(x);return x;};
  B("EXIT",()=>{if(!isDirty()||confirm("Exit without saving your changes?"))location.href=homeUrl();},"","Leave the editor.");
  b.appendChild(el("div","hr"));
  B("NEW PROGRAM",()=>ask("Name of the new program","New Program",n=>{und.push(ser());P=NEW();P.name=n||"New Program";P.stacks.push({id:uid++,x:40,y:60,i:[fromTpl({t:"Event",a:{style:"flight-start",event:"FlightStart"},k:[]})]});craft=null;snap();closeFly();}),"","Start over with a new program.");
  B("SAVE PROGRAM",()=>(clean=ser(),download(P.name.replace(/[^\w\- ]+/g,"")+".xml",toXml())),"","Download this program as an XML file.");
  B("LOAD PROGRAM",()=>{selfile="load";$("file").click();},"","Load a program or a craft file.");
  b.appendChild(el("div","hr"));
  B("IMPORT PROGRAM",()=>{selfile="import";$("file").click();},"","Add another program's blocks into this one.");
  b.appendChild(el("div","hr"));
  const r=el("div","row2");const u=el("button","btn","UNDO"),rd=el("button","btn","REDO");u.onclick=undo;rd.onclick=redo;r.append(u,rd);b.appendChild(r);
  b.appendChild(el("div","hr"));
  const g=el("div","tog");g.append(el("span",null,"Grid"));const cb=el("input");cb.type="checkbox";cb.checked=!$("cv").classList.contains("nogrid");cb.onchange=()=>$("cv").classList.toggle("nogrid",!cb.checked);g.appendChild(cb);b.appendChild(g);
  b.appendChild(el("div","hr"));const nm=el("div","tog");nm.append(el("span",null,"Program name"));b.appendChild(nm);
  const ni=el("input");ni.value=P.name;ni.style.cssText="width:100%;background:#171b1f;border:1px solid var(--bd);color:#fff;padding:6px;border-radius:3px";ni.onchange=()=>{P.name=ni.value||"New Program";snap();};b.appendChild(ni);
  const c=el("div","credit");c.innerHTML='Block definitions from the game’s Vizzy toolbox as published in <a href="https://github.com/sflanker/sr2-vizzyplusplus" target="_blank" rel="noopener">sr2-vizzyplusplus</a>.';b.appendChild(c);
}
const homeUrl=()=>location.protocol==="file:"?"../index.html":(/\.github\.io$/i.test(location.hostname)?location.origin+"/"+location.pathname.split("/")[1]+"/":"https://anda2012.github.io/Juno_New_Origins_Tools/");

/* ---------- XML in / out ---------- */
const parseNode=e=>{const a={};for(const x of e.attributes)if(x.name!=="id"&&x.name!=="pos")a[x.name]=x.value;const n=mk(e.tagName,a);
  for(const c of e.children){if(c.tagName==="Instructions")n.i=[...c.children].map(parseNode);else n.s.push(parseNode(c));}if(isBlk(n)&&!n.i)n.i=[];return n;};
const pp=s=>{const [x,y]=(s||"0,0").split(",").map(parseFloat);return{x:x||0,y:y||0};};
function fromProgram(pe){
  const Q=NEW();Q.name=pe.getAttribute("name")||"Program";
  [...(pe.querySelector(":scope > Variables")?.children||[])].forEach(v=>Q.vars.push({name:v.getAttribute("name"),list:!!v.querySelector("Items"),raw:Object.fromEntries([...v.attributes].map(a=>[a.name,a.value])),items:v.querySelector("Items")?.outerHTML}));
  pe.querySelectorAll(":scope > Instructions").forEach((ie,k)=>{const l=[...ie.children].map(parseNode);if(l.length){const p=pp(ie.children[0].getAttribute("pos"));Q.stacks.push({id:uid++,x:p.x,y:p.y,i:l});}});
  pe.querySelectorAll(":scope > Expressions > *").forEach(c=>{const p=pp(c.getAttribute("pos"));Q.exprs.push({id:uid++,x:p.x,y:p.y,n:parseNode(c)});});
  return Q;}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let nid=0;
function xn(n,pos,pad){
  const at=Object.entries(n.a).filter(([k])=>k!=="style"&&k!=="keepText").map(([k,v])=>" "+k+'="'+esc(v)+'"').join("");
  const idp=isIns(n)?' id="'+(nid++)+'"':"",st=n.a.style?' style="'+esc(n.a.style)+'"':"",ps=pos?' pos="'+pos.x+","+pos.y+'"':"";
  const kids=n.s.map(c=>xn(c,null,pad+"  ")),blk=n.i?pad+"  <Instructions>\n"+n.i.map(c=>xn(c,null,pad+"    ")).join("")+pad+"  </Instructions>\n":"";
  const head=pad+"<"+n.t+at+idp+st+ps;
  return kids.length||blk?head+">\n"+kids.join("")+blk+pad+"</"+n.t+">\n":head+" />\n";}
function toXml(){
  nid=0;let s='<Program name="'+esc(P.name)+'">\n  <Variables>\n';
  P.vars.forEach(v=>{s+=v.list?'    <Variable name="'+esc(v.name)+'">\n      <Items />\n    </Variable>\n':'    <Variable name="'+esc(v.name)+'" number="'+esc((v.raw&&v.raw.number)||"0")+'" />\n';});
  s+="  </Variables>\n";
  P.stacks.forEach(st=>{s+="  <Instructions>\n"+st.i.map((n,k)=>xn(n,k===0?{x:Math.round(st.x*1e4)/1e4,y:Math.round(st.y*1e4)/1e4}:null,"    ")).join("")+"  </Instructions>\n";});
  s+="  <Expressions>\n"+P.exprs.map(e=>xn(e.n,{x:Math.round(e.x*1e4)/1e4,y:Math.round(e.y*1e4)/1e4},"    ")).join("")+"  </Expressions>\n</Program>\n";return s;}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/xml"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
$("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>loadText(r.result,f.name);r.readAsText(f);};
function loadText(t,name){
  const d=new DOMParser().parseFromString(t,"application/xml");if(d.querySelector("parsererror"))return msg("That file isn’t valid XML");
  let progs=[...d.querySelectorAll("Program")];if(!progs.length)return msg("No Vizzy program found in that file");
  const go=pe=>{const Q=fromProgram(pe);Q.stacks.forEach(st=>st.i.forEach(harvest));Q.exprs.forEach(x=>harvest(x.n));saveOpt();
    if(selfile==="import"){und.push(ser());Q.stacks.forEach(s=>{s.x+=40;s.y+=40;P.stacks.push(s)});Q.exprs.forEach(x=>P.exprs.push(x));Q.vars.forEach(v=>{if(!P.vars.some(y=>y.name===v.name))P.vars.push(v)});snap();msg("Imported");}
    else{und.push(ser());P=Q;sync();if(d.documentElement.tagName==="Craft"){craft={doc:d,prog:pe,name};}else craft=null;
      const xs=[...P.stacks.map(s=>s),...P.exprs];if(xs.length){ox=60-Math.min(...xs.map(s=>s.x));oy=60-Math.min(...xs.map(s=>s.y));}snap();clean=ser();msg("Loaded "+Q.name);}
    closeFly();};
  if(progs.length===1)return go(progs[0]);
  chooser(progs.map((p,i)=>{const part=p.closest("Part");return (part?(part.getAttribute("name")||part.getAttribute("partType"))+" – ":"")+(p.getAttribute("name")||"Program");}),i=>go(progs[i]));}
/* ---------- dialogs ---------- */
function modal(h){$("mbox").innerHTML="";$("mbox").appendChild(h);$("modal").style.display="flex";}
const hide=()=>{$("modal").style.display="none";};
function ask(title,val,cb){const w=el("div");w.append(el("h3",null,title));const i=el("input");i.value=val||"";const r=el("div","row2");const c=el("button","btn","Cancel"),o=el("button","btn pri","OK");c.onclick=hide;o.onclick=()=>{hide();cb(i.value);};i.onkeydown=e=>{if(e.key==="Enter")o.click();};r.append(c,o);w.append(i,r);modal(w);i.focus();}
function chooser(list,cb){const w=el("div");w.append(el("h3",null,"Choose a program"));list.forEach((t,i)=>{const b=el("button","btn",t);b.onclick=()=>{hide();cb(i);};w.appendChild(b);});const c=el("button","btn","Cancel");c.onclick=hide;w.appendChild(c);modal(w);}
$("modal").onclick=e=>{if(e.target===$("modal"))hide();};

/* ---------- start ---------- */
P.stacks.push({id:uid++,x:40,y:60,i:[fromTpl({t:"Event",a:{style:"flight-start",event:"FlightStart"},k:[]})]});
clean=ser();bar();draw();
window.__t={get P(){return P},set P(v){P=v},toXml,fromProgram,loadText,draw,render,fromTpl,locate,lift,dropAt,snap,undo,T};
